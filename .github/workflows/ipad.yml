name: Objective-C iPad frame
on:
  workflow_dispatch:
  push:
    branches: [objectivec-ipad-frame]
    paths: ['ios/**', '.github/workflows/ipad.yml']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch ARMv7 SDK
        uses: actions/checkout@v4
        with:
          repository: xybp888/iOS-SDKs
          ref: 4a48e5409f8ea6ac422c44d91b86fa0f8ae010ff
          path: sdk-source
          sparse-checkout: iPhoneOS10.3.sdk
          persist-credentials: false
      - name: Fetch libsmb2
        uses: actions/checkout@v4
        with:
          repository: sahlberg/libsmb2
          ref: b9444620ba7f26ed216a663bf2282a9427e36c36
          path: smb-source
          persist-credentials: false
      - name: Test native photo cache
        run: clang -fobjc-arc -framework Foundation ios/PhotoStore.m ios/tests/store.m -o "$RUNNER_TEMP/store-test" && "$RUNNER_TEMP/store-test"
      - name: Install Debian package builder
        run: command -v dpkg-deb || brew install dpkg
      - name: Build and verify application
        run: bash ios/build.sh "$PWD/sdk-source/iPhoneOS10.3.sdk" "$RUNNER_TEMP/frame"
      - uses: actions/upload-artifact@v4
        with:
          name: iFrame3-native-armv7
          path: |
            ${{ runner.temp }}/frame/iFrame3-native-armv7.ipa
            ${{ runner.temp }}/frame/iFrame3-native-armv7.deb
          if-no-files-found: error
